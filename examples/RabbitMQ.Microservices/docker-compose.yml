services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: raytree_example
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # postgres 18+ stores data under a major-version subdirectory inside /var/lib/postgresql
      # (e.g. /var/lib/postgresql/18/main). Mount the parent so the named volume captures
      # the version-specific path and survives upgrades via pg_upgrade.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d raytree_example"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    # Pinned (not :latest) so the example stays reproducible as upstream RabbitMQ releases land.
    image: rabbitmq:4.3.0-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI — http://localhost:15672 (guest/guest)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  order-service:
    build:
      # Build context is the repo root so ProjectReference paths to ../../../src/RayTree.* resolve.
      context: ../..
      dockerfile: examples/RabbitMQ.Microservices/OrderService/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      POSTGRES_CONNECTION: "Host=postgres;Port=5432;Database=raytree_example;Username=postgres;Password=postgres"
      DOTNET_ENVIRONMENT: Development
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: ../..
      dockerfile: examples/RabbitMQ.Microservices/NotificationService/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      DOTNET_ENVIRONMENT: Development
    # NO hard dependency on order-service. WaitForTopology = true in the consumer options probes
    # the exchange passively and retries until order-service declares it — decoupling startup order
    # without relying on compose depends_on for application-level topology readiness.
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
