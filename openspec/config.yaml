schema: spec-driven

context: |
  # RayTree — Entity Change Tracking Library for .NET

  ## Description
  A modular .NET 10 entity change-tracking library built on the outbox pattern.
  Tracks inserts, updates, and deletes on any entity type, persists them reliably
  via an outbox, and fans them out to RabbitMQ, Kafka, PostgreSQL NOTIFY, or any
  custom broker — with built-in serialization, compression, deduplication, and retry.

  Repository: https://github.com/bitc0der/RayTree
  License: Apache 2.0
  Version: 0.0.16-pre-release

  ## Tech Stack
  - Language: C# (LangVersion latest)
  - Framework: .NET 10 (net10.0)
  - Nullable: enable (warnings as errors via TreatWarningsAsErrors=true)
  - ImplicitUsings: enable
  - Centralized package management (Directory.Packages.props)
  - Testing: NUnit 4.6.0 + Moq 4.20.72 + Testcontainers 4.11.0 (for integration tests requiring Docker)
  - CI: GitHub Actions (build → 9-way unit tests → 3-way integration tests)

  ## Package Layout (21 projects)
  - RayTree.Core — Core abstractions, EntityChangeTracker, fluent builders
  - RayTree.Hosting — AddChangeTracking for .NET Generic Host / ASP.NET Core
  - RayTree.EntityFrameworkCore — EntityChangeInterceptor (auto-track EF Core SaveChanges)
  - RayTree.OpenTelemetry — OTel SDK wiring (peer assembly, no transitive deps)
  - 6 queue/storage plugins: InMemory, PostgreSQL, RabbitMQ, Kafka, Deduplication.Redis
  - 3 serializer plugins: Json, Protobuf, MessagePack
  - 3 compressor plugins: Gzip, Brotli, LZ4
  - + corresponding test projects

  ## Architecture
  Pipeline: EntityChangeTracker → IOutbox → OutboxPublisherService → IQueuePublisher
            → MessageEnvelope → IQueueConsumer → ChangeSubscriber → ChangeHandlerAsync<TEntity>
  Key patterns: Outbox pattern, Background polling (OutboxPublisherService),
                PostgreSQL NOTIFY/LISTEN fast-path (NotificationBasedPublisher),
                Shared vs Isolated handler dispatch mode,
                Dedup mark-before-process with revert-on-failure,
                At-most-once (default) / At-least-once (opt-in AckAfterHandler)

  ## Design Principles
  - SRP, OCP, LSP, ISP, DIP, KISS, DRY, YAGNI
  - Constructor injection for all dependencies (no service locator, no static state)
  - Interfaces over abstract classes for plugin contracts
  - Internal Publisher/Subscriber on EntityChangeTracker (InternalsVisibleTo)
  - Reflection-based generic dispatch (MethodInfo.MakeGenericMethod)
  - PostgreSQL flat column outbox schema (not JSON) with EntityColumnMapper
  - OTel SDK isolation via peer assembly (no OpenTelemetry.* transitive deps)
  - NullLoggerFactory defaults only in builders, never in runtime services
  - Metrics (RayTreeMeter) required in all runtime service constructors

  ## Code Conventions
  - Private/internal fields: _camelCase; static: PascalCase; constants: PascalCase
  - Expression-bodied members for single-expression methods/properties/accessors
  - using directives outside namespace; System namespaces first
  - Braces on new line (Allman style)
  - Named params especially with multiple same-type args
  - Avoid this. unless absolutely necessary
  - Space indentation, 4 spaces
  - Trim trailing whitespace; insert final newline

  ## Async / Await
  - All I/O methods async + CancellationToken (last parameter)
  - Never async void; never .Result/.Wait(); no ConfigureAwait(false)
  - Async suffix on async methods

  ## Exception Handling
  - Catch most specific exception type
  - Never catch(Exception) except top-level loop boundary
  - Never swallow exceptions silently
  - Let OperationCanceledException propagate
  - Prefer bool-returning Try* over try/catch for control flow

  ## Nullability Discipline
  - Every reference type annotated (nullable or non-nullable)
  - ArgumentNullException.ThrowIfNull() for guard clauses
  - Return Empty collections instead of null (Array.Empty, Enumerable.Empty)
  - When in doubt, make it non-nullable and throw ArgumentNullException

  ## Disposable
  - IAsyncDisposable for types owning async resources
  - await using / using at call site (never manual Dispose)
  - Cancel CancellationTokenSource before dispose on background-loop owners

  ## Testing Conventions
  - MethodUnderTest_Scenario_ExpectedBehaviour naming
  - Arrange / Act / Assert with blank line separation
  - One logical outcome per test (multiple Assert fine for same fact)
  - No shared mutable state between tests
  - Unit tests: no file system, network, or DateTime.UtcNow (use TimeProvider)
  - Use Assert.ThrowsAsync<T>() for async exceptions (no try/catch + Assert.Fail)
  - Mock at interface level (IOutbox, IQueuePublisher, etc.)
  - Integration tests: [NonParallelizable], unique topic/queue names per test

  ## Package Version Management
  - NuGet packages in Directory.Packages.props with <ManagePackageVersionsCentrally>true
  - .csproj files reference packages without version attribute
  - Do NOT modify Directory.Packages.props versions unless explicitly asked

  ## Key Dependencies (current versions)
  - Microsoft.Extensions.*: 10.0.8
  - Npgsql: 10.0.2
  - RabbitMQ.Client: 7.2.1
  - Confluent.Kafka: 2.14.0
  - protobuf-net: 3.2.56
  - MessagePack: 3.1.4
  - K4os.Compression.LZ4: 1.3.8
  - OpenTelemetry: 1.15.3
  - StackExchange.Redis: 2.13.1
  - Microsoft.EntityFrameworkCore: 10.0.8
  - Testcontainers: 4.11.0

  ## Domain
  Entity change tracking / CDC infrastructure for .NET microservices.
  Used for: read model updates, event-driven integrations, audit logs,
  cache invalidation, cross-service notifications, CQRS.

rules:
  proposal:
    - Include a "Problem" section explaining what issue the change solves
    - Include a "Solution" section with the high-level approach
    - List packages affected and whether they need new public API surface
    - Note any breaking changes in public API
    - Keep proposals under 1000 words
  tasks:
    - Each task should produce a single logical change (one interface, one class, one test file group)
    - Break tasks into chunks that can be built and tested independently
    - Always include a build step and test step per task
    - Prefer editing existing files over creating new ones
